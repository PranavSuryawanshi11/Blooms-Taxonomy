[pytest]
testpaths = tests
pythonpath = . backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    smoke: Quick sanity and import tests
    e2e: End-to-end tests requiring live environment or LLM credentials
filterwarnings =
    ignore::DeprecationWarning

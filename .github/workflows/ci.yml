name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build, Lint & Automated Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax validation (compileall)
        run: |
          python -m compileall backend tests

      - name: Code quality check with Ruff (Report-Only)
        run: |
          ruff check . --exit-zero

      - name: Run unit & smoke test suite
        run: |
          pytest tests/ -v

      - name: E2E Live Test Runner (Conditional)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$CEREBRAS_API_KEY" ] && [ -z "$MISTRAL_API_KEY" ]; then
            echo "Skipping E2E live test: No LLM API key configured in repository secrets."
          else
            echo "Starting local Flask daemon for E2E live test..."
            python backend/app.py &
            sleep 4
            python backend/test_e2e_live.py
          fi
        shell: bash

